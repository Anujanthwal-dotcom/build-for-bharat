version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|GOOGLE_API_KEY|AUTH_SECRET|NEXTAUTH_SECRET|NEXTAUTH_URL|AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET)=' >> .env.production || true
        - cp .env.production .env || true
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
    build:
      commands:
        - npm run build
        - cp .env.production .next/standalone/.env.production 2>/dev/null || true
        - cp .env.production .next/.env.production 2>/dev/null || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*

